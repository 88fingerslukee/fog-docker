name: FOG Release Trigger

on:
  schedule:
    # Check for new FOG releases every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      fog_version:
        description: 'FOG version to build (stable = latest final + latest RC, or a specific tag/branch)'
        required: false
        default: 'stable'

jobs:
  check-fog-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      has-builds: ${{ steps.check.outputs.has-builds }}
    steps:
    - name: Check for new FOG releases
      id: check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          FOG_VERSION="${{ github.event.inputs.fog_version }}"
        else
          FOG_VERSION="stable"
        fi

        # Returns 0 if fog-<tag> already exists on this repo.
        tag_exists() {
          local version="$1"
          local fog_docker_tag="fog-${version}"
          local http_code
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/88fingerslukee/fog-docker/git/ref/tags/${fog_docker_tag}")
          if [ "$http_code" = "200" ]; then
            return 0
          elif [ "$http_code" = "404" ]; then
            return 1
          else
            echo "Warning: GitHub API returned HTTP $http_code when checking tag ${fog_docker_tag}; treating as missing"
            return 1
          fi
        }

        is_rc_version() {
          echo "$1" | grep -qiE '(^|[^a-z])rc([^a-z]|$)|-rc-|RC-'
        }

        validate_version() {
          local version="$1"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Error: Invalid FOG version: '$version'"
            exit 1
          fi
          if echo "$version" | grep -qE '[^a-zA-Z0-9._-]'; then
            echo "Error: FOG version contains invalid characters: '$version'"
            exit 1
          fi
        }

        # Append {"fog-version":"...","is-rc":"..."} candidates that are not built yet.
        CANDIDATES='[]'
        add_candidate() {
          local version="$1"
          local is_rc="$2"
          validate_version "$version"
          if tag_exists "$version"; then
            echo "Already built: fog-${version}"
            return 0
          fi
          echo "Queued build: fog-${version} (is-rc=${is_rc})"
          CANDIDATES=$(echo "$CANDIDATES" | jq -c \
            --arg v "$version" --arg rc "$is_rc" \
            '. + [{"fog-version": $v, "is-rc": $rc}]')
        }

        if [ "$FOG_VERSION" = "stable" ]; then
          API_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/FOGProject/fogproject/releases?per_page=100")
          HTTP_CODE=$(echo "$API_RESPONSE" | tail -n1)
          API_BODY=$(echo "$API_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Error: GitHub API returned HTTP $HTTP_CODE"
            echo "Response: $API_BODY"
            exit 1
          fi

          if ! echo "$API_BODY" | jq empty 2>/dev/null; then
            echo "Error: Invalid JSON response from GitHub API"
            echo "Response: $API_BODY"
            exit 1
          fi

          # Final releases only (exclude RC/alpha/beta/preview by tag name too —
          # FOG currently publishes RCs as normal GitHub releases).
          FINAL_TAG=$(echo "$API_BODY" | jq -r '
            [
              .[]
              | select(.draft == false)
              | .tag_name
              | select(test("(?i)(rc|alpha|beta|preview)") | not)
            ][0] // empty
          ')

          # Newest RC only — not alpha/beta/preview.
          RC_TAG=$(echo "$API_BODY" | jq -r '
            [
              .[]
              | select(.draft == false)
              | .tag_name
              | select(test("(?i)rc"))
              | select(test("(?i)(alpha|beta|preview)") | not)
            ][0] // empty
          ')

          if [ -z "$FINAL_TAG" ]; then
            echo "Error: Could not find a final FOG release tag"
            exit 1
          fi

          echo "Latest final FOG release: $FINAL_TAG"
          add_candidate "$FINAL_TAG" "false"

          if [ -n "$RC_TAG" ]; then
            echo "Latest FOG RC: $RC_TAG"
            add_candidate "$RC_TAG" "true"
          else
            echo "No FOG RC release found"
          fi
        else
          # Manual specific ref/tag/branch.
          IS_RC="false"
          if is_rc_version "$FOG_VERSION"; then
            IS_RC="true"
          fi
          add_candidate "$FOG_VERSION" "$IS_RC"
        fi

        # Deduplicate if final and RC somehow collide.
        CANDIDATES=$(echo "$CANDIDATES" | jq -c 'unique_by(."fog-version")')

        echo "Build matrix: $CANDIDATES"
        echo "matrix=$CANDIDATES" >> "$GITHUB_OUTPUT"

        if [ "$(echo "$CANDIDATES" | jq 'length')" -gt 0 ]; then
          echo "has-builds=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-builds=false" >> "$GITHUB_OUTPUT"
        fi

  build-and-push:
    needs: check-fog-releases
    if: needs.check-fog-releases.outputs.has-builds == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-fog-releases.outputs.matrix) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Generate fog-docker changelog
      id: changelog
      run: |
        PREV_TAG=$(git tag -l 'fog-*' --sort=-version:refname | grep -vxF 'fog-null' | head -1 || true)
        if [ -n "$PREV_TAG" ]; then
          NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)' --no-merges || true)
        fi
        if [ -z "$NOTES" ]; then
          if [ -n "$PREV_TAG" ]; then
            NOTES="- No fog-docker commits since ${PREV_TAG}"
          else
            NOTES="- Initial tracked release for this versioning scheme"
          fi
        fi
        if [ -n "$PREV_TAG" ]; then
          echo "Changelog since ${PREV_TAG}:"
          echo "$NOTES"
        fi
        {
          echo 'notes<<EOF'
          echo "$NOTES"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
        if [ -n "$PREV_TAG" ]; then
          echo "since-tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set FOG version
      id: fog-version
      run: |
        FOG_VERSION="${{ matrix.fog-version }}"
        IS_RC="${{ matrix.is-rc }}"

        if [ -z "$FOG_VERSION" ] || [ "$FOG_VERSION" = "null" ]; then
          echo "Error: FOG version is null or empty. Cannot build image."
          exit 1
        fi

        if echo "$FOG_VERSION" | grep -qE '[^a-zA-Z0-9._-]'; then
          echo "Error: FOG version contains invalid characters: '$FOG_VERSION'"
          exit 1
        fi

        echo "fog-version=$FOG_VERSION" >> "$GITHUB_OUTPUT"
        echo "is-rc=$IS_RC" >> "$GITHUB_OUTPUT"
        echo "Building FOG version: $FOG_VERSION (is-rc=$IS_RC)"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/88fingerslukee/fog-docker
        tags: |
          type=raw,value=fog-${{ steps.fog-version.outputs.fog-version }}
          type=raw,value=latest,enable=${{ steps.fog-version.outputs.is-rc != 'true' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          FOG_GIT_REF=${{ steps.fog-version.outputs.fog-version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Check if GitHub release already exists
      id: release-exists
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="fog-${{ steps.fog-version.outputs.fog-version }}"
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
        if [ "$HTTP_CODE" = "200" ]; then
          echo "Release ${TAG} already exists; skipping create."
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub Release (final)
      if: steps.release-exists.outputs.exists != 'true' && steps.fog-version.outputs.is-rc != 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: fog-${{ steps.fog-version.outputs.fog-version }}
        name: FOG Docker ${{ steps.fog-version.outputs.fog-version }}
        prerelease: false
        body: |
          Built with FOG Project **${{ steps.fog-version.outputs.fog-version }}**.

          **Image:** `ghcr.io/88fingerslukee/fog-docker:fog-${{ steps.fog-version.outputs.fog-version }}` (also tagged `:latest`)

          ## fog-docker changes${{ steps.changelog.outputs.since-tag && format(' (since {0})', steps.changelog.outputs.since-tag) || '' }}
          ${{ steps.changelog.outputs.notes }}

          ## Upstream changelog
          See the [FOG Project release](https://github.com/FOGProject/fogproject/releases/tag/${{ steps.fog-version.outputs.fog-version }}) for application-level changes.

          ## Documentation
          - [Full README](https://github.com/88fingerslukee/fog-docker/blob/main/README.md)
          - [Configuration Guide](https://github.com/88fingerslukee/fog-docker/blob/main/.env.example)
          - [Troubleshooting](https://88fingerslukee.github.io/fog-docker/troubleshooting)
          - [FOG Project Documentation](https://wiki.fogproject.org/)
        generate_release_notes: false

    - name: Create GitHub Release (RC)
      if: steps.release-exists.outputs.exists != 'true' && steps.fog-version.outputs.is-rc == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: fog-${{ steps.fog-version.outputs.fog-version }}
        name: FOG Docker ${{ steps.fog-version.outputs.fog-version }} (Release Candidate)
        prerelease: true
        body: |
          Built with FOG Project **${{ steps.fog-version.outputs.fog-version }}** (release candidate).

          **Image:** `ghcr.io/88fingerslukee/fog-docker:fog-${{ steps.fog-version.outputs.fog-version }}`

          This is a **pre-release**. It is **not** tagged as `:latest`. Use the versioned tag above if you want to try this RC.

          ## fog-docker changes${{ steps.changelog.outputs.since-tag && format(' (since {0})', steps.changelog.outputs.since-tag) || '' }}
          ${{ steps.changelog.outputs.notes }}

          ## Upstream changelog
          See the [FOG Project release](https://github.com/FOGProject/fogproject/releases/tag/${{ steps.fog-version.outputs.fog-version }}) for application-level changes.

          ## Documentation
          - [Full README](https://github.com/88fingerslukee/fog-docker/blob/main/README.md)
          - [Configuration Guide](https://github.com/88fingerslukee/fog-docker/blob/main/.env.example)
          - [Troubleshooting](https://88fingerslukee.github.io/fog-docker/troubleshooting)
          - [FOG Project Documentation](https://wiki.fogproject.org/)
        generate_release_notes: false
