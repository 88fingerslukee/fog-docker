name: FOG Release Trigger

on:
  schedule:
    # Check for new FOG releases every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      fog_version:
        description: 'FOG version to build (e.g., stable, dev-branch, or specific version)'
        required: false
        default: 'stable'

jobs:
  check-fog-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new-release: ${{ steps.check.outputs.new-release }}
      fog-version: ${{ steps.check.outputs.fog-version }}
    steps:
    - name: Check for new FOG releases
      id: check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Get the latest FOG release
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          FOG_VERSION="${{ github.event.inputs.fog_version }}"
        else
          FOG_VERSION="stable"
        fi
        
        # Get the latest final release tag from FOG repository with error handling.
        # Current release candidates such as 1.6.0-RC-3 are published as normal
        # GitHub releases, so the tag name has to be checked as well.
        if [ "$FOG_VERSION" = "stable" ]; then
          # Fetch with retry logic and error handling
          API_RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://api.github.com/repos/FOGProject/fogproject/releases?per_page=100")
          HTTP_CODE=$(echo "$API_RESPONSE" | tail -n1)
          API_BODY=$(echo "$API_RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Error: GitHub API returned HTTP $HTTP_CODE"
            echo "Response: $API_BODY"
            exit 1
          fi
          
          # Validate JSON before parsing
          if ! echo "$API_BODY" | jq empty 2>/dev/null; then
            echo "Error: Invalid JSON response from GitHub API"
            echo "Response: $API_BODY"
            exit 1
          fi
          
          LATEST_TAG=$(echo "$API_BODY" | jq -r '
            [
              .[]
              | select(.draft == false and .prerelease == false)
              | .tag_name
              | select(test("(?i)(rc|alpha|beta|preview)") | not)
            ][0] // empty
          ')
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Error: Could not find a final FOG release tag"
            echo "Response: $API_BODY"
            exit 1
          fi
        else
          LATEST_TAG="$FOG_VERSION"
        fi
        
        echo "Checking FOG version: $LATEST_TAG"
        
        # Check if we already have this version (lookup exact tag — paginated tag lists miss older entries)
        FOG_DOCKER_TAG="fog-${LATEST_TAG}"
        TAG_REF_RESPONSE=$(curl -s -w "\n%{http_code}" \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          "https://api.github.com/repos/88fingerslukee/fog-docker/git/ref/tags/${FOG_DOCKER_TAG}")
        TAG_REF_HTTP_CODE=$(echo "$TAG_REF_RESPONSE" | tail -n1)

        if [ "$TAG_REF_HTTP_CODE" = "200" ]; then
          EXISTING_TAGS="$FOG_DOCKER_TAG"
        elif [ "$TAG_REF_HTTP_CODE" = "404" ]; then
          EXISTING_TAGS=""
        else
          echo "Warning: GitHub API returned HTTP $TAG_REF_HTTP_CODE when checking tag ${FOG_DOCKER_TAG}"
          echo "Assuming release does not exist"
          EXISTING_TAGS=""
        fi
        
        # Validate the tag name before proceeding
        if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ] || [ "$LATEST_TAG" = "null\n" ]; then
          echo "Error: Invalid FOG version detected: '$LATEST_TAG'"
          echo "Cannot proceed with null or empty version"
          exit 1
        fi
        
        # Additional validation: ensure tag doesn't contain invalid characters
        if echo "$LATEST_TAG" | grep -qE '[^a-zA-Z0-9._-]'; then
          echo "Error: FOG version contains invalid characters: '$LATEST_TAG'"
          exit 1
        fi
        
        if [ -z "$EXISTING_TAGS" ]; then
          echo "New FOG release found: $LATEST_TAG"
          echo "new-release=true" >> $GITHUB_OUTPUT
          echo "fog-version=$LATEST_TAG" >> $GITHUB_OUTPUT
        else
          echo "FOG version $LATEST_TAG already exists"
          echo "new-release=false" >> $GITHUB_OUTPUT
          echo "fog-version=$LATEST_TAG" >> $GITHUB_OUTPUT
        fi

  build-and-push:
    needs: check-fog-releases
    if: needs.check-fog-releases.outputs.new-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Generate fog-docker changelog
      id: changelog
      run: |
        PREV_TAG=$(git tag -l 'fog-*' --sort=-version:refname | grep -vxF 'fog-null' | head -1 || true)
        if [ -n "$PREV_TAG" ]; then
          NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)' --no-merges || true)
        fi
        if [ -z "$NOTES" ]; then
          if [ -n "$PREV_TAG" ]; then
            NOTES="- No fog-docker commits since ${PREV_TAG}"
          else
            NOTES="- Initial tracked release for this versioning scheme"
          fi
        fi
        if [ -n "$PREV_TAG" ]; then
          echo "Changelog since ${PREV_TAG}:"
          echo "$NOTES"
        fi
        {
          echo 'notes<<EOF'
          echo "$NOTES"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
        if [ -n "$PREV_TAG" ]; then
          echo "since-tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set FOG version
      id: fog-version
      run: |
        FOG_VERSION="${{ needs.check-fog-releases.outputs.fog-version }}"
        
        # Validate version - fail if null or empty (should have been caught earlier, but double-check)
        if [ -z "$FOG_VERSION" ] || [ "$FOG_VERSION" = "null" ] || [ "$FOG_VERSION" = "null\n" ]; then
          echo "Error: FOG version is null or empty. Cannot build image."
          echo "This should not happen if the check step passed validation."
          exit 1
        fi
        
        # Validate tag name doesn't contain invalid characters
        if echo "$FOG_VERSION" | grep -qE '[^a-zA-Z0-9._-]'; then
          echo "Error: FOG version contains invalid characters: '$FOG_VERSION'"
          exit 1
        fi
        
        echo "fog-version=$FOG_VERSION" >> $GITHUB_OUTPUT
        echo "Building with FOG version: $FOG_VERSION"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/88fingerslukee/fog-docker
        tags: |
          type=raw,value=fog-${{ steps.fog-version.outputs.fog-version }}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          FOG_GIT_REF=${{ steps.fog-version.outputs.fog-version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Check if GitHub release already exists
      id: release-exists
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="fog-${{ steps.fog-version.outputs.fog-version }}"
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
        if [ "$HTTP_CODE" = "200" ]; then
          echo "Release ${TAG} already exists; skipping create."
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub Release
      if: steps.release-exists.outputs.exists != 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: fog-${{ steps.fog-version.outputs.fog-version }}
        name: FOG Docker ${{ steps.fog-version.outputs.fog-version }}
        body: |
          Built with FOG Project **${{ steps.fog-version.outputs.fog-version }}**.

          **Image:** `ghcr.io/88fingerslukee/fog-docker:fog-${{ steps.fog-version.outputs.fog-version }}` (also tagged `:latest`)

          ## fog-docker changes${{ steps.changelog.outputs.since-tag && format(' (since {0})', steps.changelog.outputs.since-tag) || '' }}
          ${{ steps.changelog.outputs.notes }}

          ## Upstream changelog
          See the [FOG Project release](https://github.com/FOGProject/fogproject/releases/tag/${{ steps.fog-version.outputs.fog-version }}) for application-level changes.

          ## Documentation
          - [Full README](https://github.com/88fingerslukee/fog-docker/blob/main/README.md)
          - [Configuration Guide](https://github.com/88fingerslukee/fog-docker/blob/main/.env.example)
          - [Troubleshooting](https://88fingerslukee.github.io/fog-docker/troubleshooting)
          - [FOG Project Documentation](https://wiki.fogproject.org/)
        generate_release_notes: false
